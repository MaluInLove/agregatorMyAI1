services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_aggregator}
      POSTGRES_USER: ${POSTGRES_USER:-ai_aggregator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    env_file: ${APP_ENV_FILE:-.env.docker}
    command: ["node", "scripts/production-bootstrap.ts"]
    environment: &app_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_aggregator}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@postgres:5432/${POSTGRES_DB:-ai_aggregator}?schema=public
      LOCAL_STORAGE_PATH: /app/var/storage
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_storage:/app/var/storage
    restart: "no"

  web:
    build: .
    env_file: ${APP_ENV_FILE:-.env.docker}
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - app_storage:/app/var/storage
    restart: unless-stopped

  worker:
    build: .
    env_file: ${APP_ENV_FILE:-.env.docker}
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker/index.ts"]
    environment: *app_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_storage:/app/var/storage
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
